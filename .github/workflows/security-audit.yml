# Audit kebergantungan produksi storefront setiap minggu (dan bila dicetus manual) → hantar ke
# POST /api/security/report; cron /api/cron/security-digest (Isnin 08:10 MYT) menggabungkannya dalam emel admin.
# Rahsia repo yang diperlukan: CRON_SECRET (sama dengan env Vercel).
name: security-audit
on:
  schedule:
    - cron: '30 23 * * 0'   # Ahad 23:30 UTC = Isnin 07:30 MYT (sebelum digest 08:10)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (prod deps)
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.metadata && a.metadata.vulnerabilities || {}))'
      - name: Hantar laporan ke storefront
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Rahsia CRON_SECRET tiada — laporan tidak dihantar"; exit 0; fi
          node -e '
            const fs=require("fs"); const audit=JSON.parse(fs.readFileSync("audit.json","utf8"));
            fs.writeFileSync("payload.json", JSON.stringify({ source:"storefront", audit, node: process.version, ref: process.env.GITHUB_SHA.slice(0,7) }));
          '
          curl -sS -X POST https://shop.syababfresh.my/api/security/report \
            -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            --data-binary @payload.json
